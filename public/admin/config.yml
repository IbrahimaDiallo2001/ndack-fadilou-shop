# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: IbrahimaDiallo2001/ndack-fadilou-shop
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/14b0548d-6722-4b8a-b6f6-aca2ee15af9f/pkce
  auth_token_endpoint: /sites/14b0548d-6722-4b8a-b6f6-aca2ee15af9f/token
  gateway_url: https://gateway.decapbridge.com
  # Voir qui a fait quoi (optionnel)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://ndack-fadilou-shop.netlify.app

media_folder: "public/images"
public_folder: "/images"

locale: "fr"

collections:
  - name: "products"
    label: "Catalogue"
    files:
      - file: "public/data/products.json"
        label: "Produits"
        name: "products"
        fields:
          - label: "Produits"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — {{fields.dept}}"
            fields:
              - { label: "Rayon", name: "dept", widget: "select", options: [
                    { label: "Vêtements", value: "vetements" },
                    { label: "Accessoires", value: "accessoires" },
                    { label: "Parfums", value: "parfums" },
                    { label: "Montres", value: "montres" },
                    { label: "Chaussures", value: "chaussures" },
                    { label: "Lunettes", value: "lunettes" },
                  ] }
              - { label: "Nom du produit", name: "name", widget: "string" }
              - { label: "Matière / détail", name: "material", widget: "string" }
              - { label: "Prix", name: "price", widget: "string", hint: "Ex : 45 000 FCFA, ou « Prix sur demande »" }
              - { label: "Photo", name: "image", widget: "image", choose_url: false, hint: "Formats recommandés : JPG, PNG ou WEBP. Sur iPhone, si la photo ne s'affiche pas après l'ajout, ouvrez Réglages > Appareil photo > Formats et choisissez « Le plus compatible »." }
              - { label: "Disponible ?", name: "available", widget: "boolean", default: true, hint: "Décochez si l'article est en rupture de stock — les visiteurs verront « Indisponible » sur la fiche." }
              - { label: "Ouvre le catalogue de maillots ?", name: "isCollection", widget: "boolean", default: false, required: false, hint: "Ne cochez ceci QUE pour l'article « Collections Maillots ». Pour tous les autres produits, laissez décoché." }
              - label: "Tailles / pointures (laisser vide si non applicable)"
                name: "sizes"
                widget: "list"
                required: false
                field: { label: "Taille", name: "size", widget: "string" }

  - name: "maillots"
    label: "Maillots"
    files:
      - file: "public/data/maillots.json"
        label: "Maillots"
        name: "maillots"
        fields:
          - label: "Maillots"
            name: "maillots"
            widget: "list"
            summary: "{{fields.equipe}} — {{fields.version}}"
            fields:
              - { label: "Équipe", name: "equipe", widget: "string", hint: "Ex : Sénégal, Real Madrid, PSG..." }
              - { label: "Version", name: "version", widget: "select", options: ["Domicile", "Extérieur", "Third"] }
              - { label: "Prix", name: "price", widget: "string", hint: "Ex : 12 000 FCFA, ou « Prix sur demande »" }
              - { label: "Photo", name: "image", widget: "image", choose_url: false, hint: "Formats recommandés : JPG, PNG ou WEBP." }
              - { label: "Disponible ?", name: "available", widget: "boolean", default: true }
              - label: "Tailles disponibles"
                name: "sizes"
                widget: "list"
                default: ["S", "M", "L", "XL", "XXL"]
                field: { label: "Taille", name: "size", widget: "string" }